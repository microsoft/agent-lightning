apiVersion: batch/v1
kind: Job
metadata:
  name: auto
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: llm-in-sandbox-agent:dev
          command: ["python", "/app/runner.py"]
          imagePullPolicy: Never
          env:
            - name: DATA_FOLDER_NAME
              value: {{ input.extra_info.data_folder_name | yaml_escape }}
            - name: DATA_FILENAME
              value: {{ input.extra_info.data_filename | yaml_escape }}
            - name: DATA_INDEX
              value: {{ input.extra_info.data_index | yaml_escape }}
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"