# Gateway config for vLLM mode.
#
# Injects RL-specific parameters into all requests forwarded to vLLM:
#   - return_token_ids: true — returns prompt_token_ids and token_ids
#     in the response, needed for RL training (PPO, GRPO, etc.)
#
# The agent doesn't need to know about these — they're injected transparently
# by the gateway before forwarding to vLLM.

routes:
  - model_in: "*"           # match all models
    model_out: "*"          # passthrough (keep original model name)
    params:
      add:
        return_token_ids: true
