apiVersion: batch/v1
kind: Job
metadata:
  name: {{ job_name }}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: {{ input.image_name | yaml_escape }}
          command: ["bash", "-lc", "set -o pipefail && pip install --quiet openai && python /agl/agents/smith_agent.py 2>&1 | tee /agl-logs/{{ job_name }}.log"]
          imagePullPolicy: IfNotPresent
          env:
            - name: AGL_TASK_INPUT
              value: {{ input.problem_statement | yaml_escape }}
          resources:
            requests:
              cpu: "50m"
              memory: "4Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
          volumeMounts:
            - name: agent-scripts
              mountPath: /agl/agents
              readOnly: true
            - name: rollout-logs
              mountPath: /agl-logs
      volumes:
        - name: agent-scripts
          configMap:
            name: swe-smith-agent-scripts
            defaultMode: 0755
        - name: rollout-logs
          hostPath:
            path: /home/v-zhiwenzhou/agl-logs
            type: DirectoryOrCreate
