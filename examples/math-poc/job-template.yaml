# K8s Pod spec for math-poc agent jobs.
# See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#PodSpec
#
# The controller injects into the "agent" container:
#   env vars: OPENAI_BASE_URL, OPENAI_API_KEY, AGL_TASK_INPUT, etc. (auto)
#
# image and command are fixed for this PoC — all rollouts share them.

containers:
  - name: agent
    image: math-agent:dev
    command: ["python", "/app/qa_agent.py", "--model", "mock-llm"]
    imagePullPolicy: Never
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
