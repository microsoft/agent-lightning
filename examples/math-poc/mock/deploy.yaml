namespace: agl-test
mode: agl-in-k8s

agl_host_ip_bind: 0.0.0.0
agl_host_port: 8080

controller:
  poll_interval_seconds: 10
  max_queue_time_seconds: 3600

server_runtime:
  gateway_config: examples/math-poc/mock/gateway-config.yaml
  hooks: examples/math-poc/mock/hooks.py
  artifact_dir: null

wait_ready_timeout_seconds: 120
local_state_dir: .local
