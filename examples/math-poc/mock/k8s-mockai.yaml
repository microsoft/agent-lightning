apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockai
  labels:
    app: mockai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockai
  template:
    metadata:
      labels:
        app: mockai
    spec:
      containers:
        - name: mockai
          image: mockai:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 5002
          env:
            - name: MOCK_TYPE
              value: "echo"
            - name: SERVER_PORT
              value: "5002"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 5002
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mockai
  labels:
    app: mockai
spec:
  selector:
    app: mockai
  ports:
    - port: 5002
      targetPort: 5002
