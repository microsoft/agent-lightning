apiVersion: batch/v1
kind: Job
metadata:
  name: auto
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: calc-x-agent:dev
          command: ["python", "/app/calc_agent.py"]
          imagePullPolicy: Never
          env:
            - name: QUESTION
              value: {{ input.question | yaml_escape }}
            - name: RESULT
              value: {{ input.result | yaml_escape }}
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
