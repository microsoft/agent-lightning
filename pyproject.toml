[project]
name = "agentlightning"
version = "1.0.0"
description = "Agent Lightning — agentic RL infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "httpx-retries>=0.4.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "structlog>=24.4.0",
    "jinja2>=3.1.6",
    "kr8s>=0.18.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "pyright>=1.1.390",
    "sympy>=1.13.0",
]

[project.scripts]
agl-server = "agentlightning.server.__main__:main"
agl-controller = "agentlightning.controller.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
    "mike>=2.2.0",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-git-authors-plugin>=0.10.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
dev = [
    "pytest-httpx>=0.36.0",
    "sympy>=1.14.0",
]
