[project]
name = "agl-lite"
version = "0.1.0"
description = "Minimal workable version of Agent Lightning — agentic RL infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.3",
    "numpy>=1.26.0",
    "click<8.3.0",
]

[project.optional-dependencies]
controller = [
    "jinja2>=3.1.6",
    "kr8s>=0.18.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "pyright>=1.1.390",
    "sympy>=1.13.0",
]
verl = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "vllm==0.10.2",
    "verl==0.7.1",
    "ray==2.49.2",
    "transformers==4.57.1",
    "tokenizers==0.22.2",
    "numpy==1.26.4",
    "triton==3.4.0",
    "accelerate==1.13.0",
    "datasets==4.8.4",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "xformers==0.0.32.post1",
    "codetiming>=1.4.0",
    "wandb>=0.18.0",
    "autogen-agentchat",
    "autogen-ext[openai]",
    "mcp>=1.10.0",
    "mcp-server-calculator",
    # NOTE: flash-attn is NOT listed here — it's source-only on PyPI and
    # requires torch at build time (circular). Install it via:
    #   scripts/setup_verl.sh (handles the two-phase install)
]

[project.scripts]
agl-lite = "agl_lite.cli:app"
agl-client = "agl_lite.client_cli:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude e2e tests by default — they require a running K8s cluster.
# Run explicitly: uv run pytest tests/e2e/cpu -v
#                 uv run pytest tests/e2e/gpu -v
addopts = "--ignore=tests/e2e"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# PyTorch GPU wheels require a CUDA-specific index. Don't hardcode it here —
# use scripts/setup_verl.sh which auto-detects CUDA version, or pass manually:
#   uv sync --extra verl --index pytorch=https://download.pytorch.org/whl/cu130


[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.3",
    "pytest-httpx>=0.36.0",
    "sympy>=1.14.0",
]
