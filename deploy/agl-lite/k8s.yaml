apiVersion: apps/v1
kind: Deployment
metadata:
  name: agl-lite
  labels:
    app: agl-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agl-lite
  template:
    metadata:
      labels:
        app: agl-lite
    spec:
      containers:
        - name: agl-lite
          image: agl-lite:dev
          imagePullPolicy: Never
          command: ["agl-lite", "serve", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: AGL_KEY
              valueFrom:
                secretKeyRef:
                  name: agl-lite-keys
                  key: AGL_KEY
            - name: AGL_GATEWAY_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_GATEWAY_CONFIG
                  optional: true
            - name: AGL_HOOKS
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_HOOKS
                  optional: true
            - name: AGL_POD_SPEC_TEMPLATE
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_POD_SPEC_TEMPLATE
                  optional: true
            - name: AGL_LOG_DIR
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_LOG_DIR
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agl-lite
  labels:
    app: agl-lite
spec:
  selector:
    app: agl-lite
  ports:
    - port: 8080
      targetPort: 8080
