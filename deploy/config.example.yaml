# Non-secret configuration — loaded into K8s ConfigMap.
# Copy to config.yaml and edit before deploying.

# Advertised URL of the agl-lite service (used by controller and agents).
# In-cluster: http://agl-lite.<namespace>.svc.cluster.local:8080
# On VM/external: http://<host>:<port>
AGL_LITE_URL: http://agl-lite.agl.svc.cluster.local:8080

# Namespace (duplicated here so controller can read from ConfigMap).
AGL_K8S_NAMESPACE: agl

# K8s Secret name holding AGL_KEY.
AGL_SECRET_NAME: agl-lite-keys

# Controller settings.
AGL_POLL_INTERVAL: "10"
AGL_MAX_QUEUE_TIME: "3600"
