# agl-lite deployment configuration.
# Copy to config.yaml and edit before deploying.

# K8s-specific settings — flattened into ConfigMap as individual keys.
# Pods consume these via env.valueFrom.configMapKeyRef.
k8s:
  AGL_K8S_NAMESPACE: agl
  AGL_LITE_URL: http://agl-lite.agl.svc.cluster.local:8080
  AGL_SECRET_NAME: agl-lite-keys

# Controller settings.
controller:
  poll_interval: 10
  max_queue_time: 3600

# Serve settings (used when agl-lite runs in K8s).
serve:
  host: 0.0.0.0
  port: 8080
