apiVersion: apps/v1
kind: Deployment
metadata:
  name: agl-controller
  labels:
    app: agl-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agl-controller
  template:
    metadata:
      labels:
        app: agl-controller
    spec:
      serviceAccountName: agl-controller
      containers:
        - name: controller
          image: agl-lite:dev
          imagePullPolicy: Never
          command:
            - "agl-lite"
            - "controller"
            - "--job-manifest-template"
            - "/etc/agl/job-template.yaml.j2"
          env:
            - name: AGL_POLL_INTERVAL
              value: "10"
            - name: AGL_MAX_QUEUE_TIME
              value: "3600"
            - name: AGL_MAX_PODS_PER_WINDOW
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_MAX_PODS_PER_WINDOW
            - name: AGL_RATE_LIMIT_WINDOW_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_RATE_LIMIT_WINDOW_SECONDS
            - name: AGL_KEY
              valueFrom:
                secretKeyRef:
                  name: agl-lite-keys
                  key: AGL_KEY
            - name: AGL_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_BASE_URL
            - name: AGL_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: agl-lite-config
                  key: AGL_NAMESPACE
          volumeMounts:
            - name: job-template
              mountPath: /etc/agl
              readOnly: true
      volumes:
        - name: job-template
          configMap:
            name: agl-controller-job-template
