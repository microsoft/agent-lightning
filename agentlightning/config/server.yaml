host: 0.0.0.0
port: 8080
key: ""
upstream_timeout_seconds: 300
# Operator caps; process rollouts bind matching or tighter admission limits at enqueue.
process_credit_limits:
  max_events_per_rollout: 100000
  max_actions_per_rollout: 1024
  max_artifact_bytes: 67108864
default_proxy:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  include_log_probs: True
  include_routed_experts: False
  score_centering:
    enabled: False
    top_logprobs_num: 128
  train:
    temperature: 1
    top_p: null
    top_k: null
    min_p: null
  val:
    temperature: 0.7
    top_p: null
    top_k: null
    min_p: null
